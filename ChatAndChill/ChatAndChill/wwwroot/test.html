<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Test chat</title>
</head>
<body>
    <h3>Test SignalR</h3>
    <textarea id="token" rows="3" cols="80" placeholder="Dán JWT token"></textarea><br>
    <button id="connect">Kết nối</button><br><br>
    <input id="convId" placeholder="conversationId" size="14">
    <input id="msg" placeholder="Nội dung" size="40">
    <button id="send">Gửi</button>
    <pre id="log"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script>
    const log = t => document.getElementById("log").textContent += t + "\n";
    let conn;

    document.getElementById("connect").onclick = async () => {
      conn = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/chat", {
          accessTokenFactory: () => document.getElementById("token").value.trim()
        })
        .withAutomaticReconnect()
        .build();

      conn.on("ReceiveMessage", m => log(`[${m.conversationId}] ${m.senderName}: ${m.content}`));

      try {
        await conn.start();
        log("Đã kết nối");
      } catch (e) {
        log("Lỗi kết nối: " + e);
      }
    };

    document.getElementById("send").onclick = async () => {
      try {
        await conn.invoke(
          "SendMessage",
          Number(document.getElementById("convId").value),
          document.getElementById("msg").value
        );
      } catch (e) {
        log("Lỗi gửi: " + e.message);
      }
    };
    </script>
</body>
</html>di
